name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # PRs share a per-ref group (a new push cancels the old run); every other
  # event gets its own per-commit group, so each push to main is tested.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Report every failing version, not just the first.
      fail-fast: false
      matrix:
        # Production pins no interpreter — scripts/bootstrap.sh builds the
        # venv from whatever python3 dnf ships — so cover the range we claim
        # to support instead of a single version. 3.11 is the floor
        # ruff.toml targets; 3.12 is what CI ran before.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Both files are pip-compile locks with hashes: the runtime tree the
        # box installs, and the pinned tooling (Ruff, pytest, pip-tools,
        # pip-audit). --require-hashes refuses anything not in them.
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Run tests
        # Auth cookie verifier, date parsing, S3 inbox layer (fake S3
        # client), and the FastAPI endpoints via TestClient.
        run: python -m pytest -q

      - name: Test privileged install lifecycle
        run: sudo env PATH="$PATH" bash scripts/test/layout_test.sh

  dependencies:
    name: Dependency lock and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The locks are compiled under the oldest supported Python.
          python-version: "3.11"

      - name: Install pinned tooling
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Lock matches requirements.in
        # pip-compile keeps existing pins, so a re-run only changes the files
        # when a .in was edited without regenerating its lock. No release-age
        # cutoff: Dependabot's cooldown holds version updates, and a security
        # update (which skips the cooldown) must not fail CI for being fresh.
        run: |
          pip-compile --quiet --generate-hashes --strip-extras requirements.in
          pip-compile --quiet --generate-hashes --strip-extras --allow-unsafe requirements-dev.in
          git diff --exit-code -- requirements.txt requirements-dev.txt

      - name: Audit locked dependencies
        run: |
          pip-audit --strict --require-hashes --disable-pip -r requirements.txt
          pip-audit --strict --require-hashes --disable-pip -r requirements-dev.txt
