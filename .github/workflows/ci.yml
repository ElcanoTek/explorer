name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # PRs share a per-ref group (a new push cancels the old run); every other
  # event gets its own per-commit group, so each push to main is tested.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    name: Go (build, vet, lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod pins the exact patch release; govulncheck reports stdlib
          # CVEs against whatever toolchain built the code.
          go-version-file: go.mod
          check-latest: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Modules are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

      - name: Test (race detector)
        # No AWS account and no network: S3 goes through an in-memory fake,
        # the auth service through httptest servers.
        run: go test -race -count=1 ./...

      - name: Test privileged install lifecycle (root)
        # The update/rollback harness asserts ownership and modes, so it only
        # runs as root; it confines itself to one mktemp directory.
        run: sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" go test -count=1 -run 'TestLifecycle|TestRequireTrusted|TestProvisionWritesPrivateFiles' ./internal/ops/

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: govulncheck (dependency and stdlib CVEs)
        # Deliberately unpinned, as in fleet: it must read the live vuln
        # database, and a call-graph scan only fails on reachable code.
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  shell:
    name: Shell lint (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        # install.sh and the scripts/ shims are the first thing a new box runs.
        run: |
          set -euo pipefail
          mapfile -t sh_files < <(git ls-files '*.sh')
          [ "${#sh_files[@]}" -gt 0 ] || { echo "::error::no shell scripts matched"; exit 1; }
          shellcheck -S warning "${sh_files[@]}"
