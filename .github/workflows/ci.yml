name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Ruff is pinned so CI and contributors' local runs agree; the
          # rule selection lives in ruff.toml.
          pip install -r requirements.txt pytest httpx2 'ruff==0.16.5'

      - name: Lint
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Run tests
        # Auth cookie verifier, date parsing, S3 inbox layer (fake S3
        # client), and the FastAPI endpoints via TestClient.
        run: python -m pytest -q
