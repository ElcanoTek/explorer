name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Report every failing version, not just the first.
      fail-fast: false
      matrix:
        # Production pins no interpreter — scripts/bootstrap.sh builds the
        # venv from whatever python3 dnf ships — so cover the range we claim
        # to support instead of a single version. 3.11 is the floor
        # ruff.toml targets; 3.12 is what CI ran before.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Ruff is pinned so CI and contributors' local runs agree; the
          # rule selection lives in ruff.toml.
          pip install -r requirements.txt pytest httpx2 'ruff==0.16.5'

      - name: Lint
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Run tests
        # Auth cookie verifier, date parsing, S3 inbox layer (fake S3
        # client), and the FastAPI endpoints via TestClient.
        run: python -m pytest -q
