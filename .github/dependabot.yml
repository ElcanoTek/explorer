# Dependabot proposes updates for Explorer's two dependency surfaces: the
# hashed pip-compile locks at the repo root (requirements.in -> .txt, which
# Dependabot regenerates with pip-compile, hashes included) and the GitHub
# Actions pinned by SHA in .github/workflows/*. Modelled on fleet's file.
#
# Proposing is not merging. A human merges a bump only when it earns it: a
# security fix whose code path Explorer uses, or a specific commit we need
# (AGENTS.md › Dependencies). In-housed code (app/_vendor, app/linkify.py) is
# ours and is not tracked here.
#
# Cadence: daily, with a supply-chain cooldown on pip so a freshly published
# release has a week to be scrutinized (or yanked) before it is proposed.
# Cooldown applies to version updates only, never to security updates.
# Minor + patch bumps are grouped per ecosystem into one PR that Dependabot
# updates in place; majors stay separate so breaking changes get their own
# review. Security updates ignore grouping and prefixes, as GitHub documents.
#
# Not covered: the Python interpreter itself (the CI matrix in ci.yml and the
# python3 dnf ships on the box) — that is a deliberate, human-initiated move.
#
# Schema: https://docs.github.com/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2

updates:
  # requirements.in / requirements.txt and requirements-dev.in / .txt.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 3
    labels: []
    commit-message:
      prefix: "deps(pip)"
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch

  # Actions referenced by .github/workflows/* (SHA pins with # vX.Y.Z).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels: []
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
