# Dependabot config — https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Two ecosystems are in play: the hashed pip-compile locks
# (requirements.in -> requirements.txt, requirements-dev.in ->
# requirements-dev.txt), and the actions pinned in .github/workflows/*.yml.
# Actions get weekly version updates bundled into one PR; pip gets security
# updates only (see below).
#
# Security updates are deliberately left ungrouped. Dependabot groups apply
# to version updates only unless a group sets `applies-to: security-updates`,
# and ungrouped is what we want here: an advisory fix arrives as its own
# small PR that can land immediately instead of riding the weekly bundle.
# Security PRs are not counted against `open-pull-requests-limit`, which is
# why the pip limit of 0 below turns off only version updates.
#
# `labels: []` opts out of labelling entirely, including Dependabot's
# default `dependencies` label. Dependabot only applies labels that already
# exist in the repo, so naming any here would mean creating and maintaining
# them by hand for no gain — these PRs are self-evident from their title.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Security updates only. A limit of 0 disables version-update PRs while
    # advisory PRs still open (they ignore this limit). Explorer bumps a
    # dependency for a CVE whose code path it uses, or a specific fix it
    # needs — not on a schedule. See AGENTS.md › Dependencies.
    open-pull-requests-limit: 0
    labels: []
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    # For this ecosystem "/" means the whole repo — i.e. every workflow under
    # .github/workflows — not a manifest sitting in the root directory.
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: []
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns:
          - "*"
