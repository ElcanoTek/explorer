# Dependabot proposes updates for Explorer's two dependency surfaces: the Go
# module graph (go.mod / go.sum) and the GitHub Actions pinned by SHA in
# .github/workflows/*. Modelled on fleet's file.
#
# Proposing is not merging. A human merges a bump only when it earns it: a
# security fix whose code path Explorer uses, or a specific commit we need
# (AGENTS.md › Dependencies). In-housed code (internal/dotenv,
# internal/htmlsafe) is ours and is not tracked here.
#
# Cadence: daily, with a supply-chain cooldown of 7 days (3 for patch
# releases), so a fresh release can be scrutinized (or yanked) before it is
# proposed. Cooldown applies to version updates only, never to security
# updates. Minor + patch bumps are grouped per ecosystem; majors stay
# separate so breaking changes get their own review.
#
# Not covered: the Go toolchain line in go.mod — a deliberate,
# human-initiated move (govulncheck flags stdlib CVEs when it is due).
#
# Schema: https://docs.github.com/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2

updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 3
    labels: []
    commit-message:
      prefix: "deps(go)"
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels: []
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
