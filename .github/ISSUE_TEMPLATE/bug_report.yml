name: Bug report
description: Something in Explorer behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Search tab and set a date range…
        2. …
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you are running (`explorer status`, or `git rev-parse --short HEAD`).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Search / View / Fuzzy, Message rendering, Attachments, Authentication, S3 access / prefix scoping, Deployment scripts, Docs]
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: Redact real senders, subjects, recipients and any message content before pasting — use synthetic examples (`ada@example.com`). See SECURITY.md.
      render: text
