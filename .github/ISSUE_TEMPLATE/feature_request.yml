name: Feature request
description: Propose an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, and why does it matter when searching an archive?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This touches authentication, S3 key scoping or HTML sanitizing and I have read the security notes in CONTRIBUTING.md
